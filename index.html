<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaime Gómez Pascual · Ingeniero Multicloud, DevOps y Seguridad</title>
    <meta
      name="description"
      content="Jaime Gómez Pascual, ingeniero cloud en España. Certificado AWS Solutions Architect y Azure (AZ-104, AZ-500). Terraform, Docker, Kubernetes y CI/CD con GitHub Actions."
    />
    <meta name="author" content="Jaime Gómez Pascual" />
    <meta name="theme-color" content="#0b0c0e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://stjgpportfolio.z43.web.core.windows.net/" />

    <!-- Aplica el tema guardado antes del primer pintado (sin parpadeo) -->
    <script>
      try {
        var t = localStorage.getItem('tema')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <!-- Open Graph / vista previa al compartir en LinkedIn.
         Si cambias de dominio, actualiza og:url, og:image y canonical. -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Jaime Gómez Pascual · Ingeniero Multicloud" />
    <meta
      property="og:description"
      content="Diseño, automatizo y despliego infraestructura cloud. AWS · Azure · Terraform · Kubernetes · GitHub Actions."
    />
    <meta property="og:url" content="https://stjgpportfolio.z43.web.core.windows.net/" />
    <meta property="og:image" content="https://stjgpportfolio.z43.web.core.windows.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jaime Gómez Pascual — Ingeniero Multicloud" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jaime Gómez Pascual",
        "url": "https://stjgpportfolio.z43.web.core.windows.net/",
        "jobTitle": "Ingeniero Multicloud, DevOps y Seguridad",
        "address": { "@type": "PostalAddress", "addressCountry": "ES" },
        "knowsAbout": ["AWS", "Microsoft Azure", "Terraform", "Docker", "Kubernetes", "GitHub Actions", "Linux"],
        "sameAs": ["https://www.linkedin.com/in/jaimegomezpascual/", "https://github.com/jaimegp03"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes sin bloquear el primer pintado (display=swap usa la del sistema mientras carga) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        Jaime Gómez Pascual — Ingeniero Multicloud. Activa JavaScript para ver el portfolio o escríbeme por
        LinkedIn: https://www.linkedin.com/in/jaimegomezpascual/
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

name: API de visitas (Azure Functions)

# Pruebas en cada cambio de la API; en main, además, despliegue en la
# Function App con OIDC (sin secretos) y prueba de humo contra la URL real.
on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  pull_request:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm test

  deploy:
    name: Desplegar en Azure Functions
    needs: test
    if: github.event_name != 'pull_request' && vars.AZURE_FUNCTIONAPP_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # necesario para pedir el token OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Dependencias de producción
        run: npm ci --omit=dev

      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar la función
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: api
          sku: flexconsumption

      - name: Prueba de humo
        env:
          URL: ${{ vars.AZURE_API_URL }}
        run: |
          # La función puede tardar unos segundos en arrancar tras el despliegue
          for i in 1 2 3 4 5 6; do
            if RESP=$(curl -fsS "$URL"); then
              echo "Respuesta: $RESP"
              echo "### API publicada en ${URL}" >> "$GITHUB_STEP_SUMMARY"
              echo '`'"$RESP"'`' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "La API no responde en $URL" && exit 1

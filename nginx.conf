server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para JS/CSS/HTML servidos por Vite
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Assets con hash en el nombre (Vite): cache agresiva e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: cualquier ruta desconocida devuelve index.html
    # (necesario para enrutado del lado cliente, si se añade en el futuro)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca debe cachearse para evitar servir una build vieja
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

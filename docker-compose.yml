services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-linkedin:local
    container_name: portfolio-linkedin
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# Levantar con: docker compose up --build
# Portafolio disponible en: http://localhost:8080
